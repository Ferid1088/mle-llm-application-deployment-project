<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar Support Assistant</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b1f27; --muted: #667085;
    --border: #e1e4ea; --accent: #2457d6; --accent-text: #ffffff;
    --user: #e8eefc; --hit: #0f7b4b; --miss: #a15c00; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e8ebf0; --muted: #98a2b3;
      --border: #2d3440; --accent: #5b8cff; --accent-text: #0b1020;
      --user: #25314f; --hit: #4cc38a; --miss: #f0b34a; --err: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
  }
  main { width: 100%; max-width: 760px; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
  header h1 { margin: 0; font-size: 1.35rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  #status { font-size: .8rem; color: var(--muted); }
  #log { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .msg { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); max-width: 92%; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.error { border-color: var(--err); color: var(--err); }
  .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .75rem; color: var(--muted); }
  .badge { font-weight: 600; }
  .badge.hit { color: var(--hit); } .badge.miss { color: var(--miss); }
  code { font-family: ui-monospace, Menlo, monospace; }
  form { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  textarea { width: 100%; resize: vertical; min-height: 64px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  textarea:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .opts { display: flex; flex-wrap: wrap; gap: 12px; font-size: .85rem; color: var(--muted); }
  .opts input { width: 72px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; min-height: 44px; }
  button:disabled { opacity: .55; cursor: wait; }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; }
  .samples button { background: transparent; color: var(--accent); border: 1px solid var(--border); font-weight: 500; font-size: .85rem; min-height: 36px; padding: 4px 12px; }
  footer { font-size: .75rem; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Northstar Support Assistant</h1>
    <p>Ask a question. Repeat it to see a cache hit. <span id="status">checking service…</span></p>
  </header>

  <section id="log" aria-live="polite"></section>

  <div class="samples" id="samples"></div>

  <form id="form">
    <label for="prompt" class="sr" style="position:absolute;left:-9999px">Your question</label>
    <textarea id="prompt" maxlength="8000" placeholder="e.g. What is the refund policy?" required></textarea>
    <div class="row">
      <div class="opts">
        <label>Max tokens <input id="max_tokens" type="number" min="1" max="2048" value="200"></label>
        <label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2"></label>
      </div>
      <button id="send" type="submit">Send</button>
    </div>
  </form>

  <footer>API docs: <a href="/docs">/docs</a> · Health: <a href="/health">/health</a></footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log");

const samples = ["What is the refund policy?", "How do I reset my password?", "Say hello"];
for (const s of samples) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = s;
  b.onclick = () => { $("prompt").value = s; $("prompt").focus(); };
  $("samples").appendChild(b);
}

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.textContent = text;
  log.appendChild(d);
  d.scrollIntoView({ block: "end", behavior: "smooth" });
  return d;
}

function meta(el, r) {
  const m = document.createElement("div");
  m.className = "meta";
  const parts = [
    [r.cache_hit ? "cache hit" : "cache miss", "badge " + (r.cache_hit ? "hit" : "miss")],
    ["latency " + r.latency_ms.toFixed(2) + " ms"],
    ["tokens " + r.usage.input_tokens + " in / " + r.usage.output_tokens + " out"],
    ["model " + r.model],
    ["quality " + r.quality_score],
  ];
  for (const [t, c] of parts) {
    const s = document.createElement("span"); s.textContent = t; if (c) s.className = c; m.appendChild(s);
  }
  const tid = document.createElement("span");
  tid.append("trace ");
  const code = document.createElement("code"); code.textContent = r.trace_id; tid.appendChild(code);
  m.appendChild(tid);
  el.appendChild(m);
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  add(prompt, "user");
  $("prompt").value = "";
  $("send").disabled = true;
  const pending = add("Thinking… (the free server may need up to a minute to wake up)");
  try {
    const res = await fetch("/generate", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        prompt,
        max_tokens: Number($("max_tokens").value) || 200,
        temperature: Number($("temperature").value),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed (" + res.status + ")");
    pending.textContent = data.text;
    meta(pending, data);
  } catch (err) {
    pending.textContent = "Error: " + err.message;
    pending.classList.add("error");
  } finally {
    $("send").disabled = false;
    $("prompt").focus();
  }
});

$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("form").requestSubmit();
});

fetch("/ready").then((r) => r.json()).then((d) => {
  $("status").textContent = "Provider: " + d.provider + " · " + d.model;
}).catch(() => { $("status").textContent = "service unreachable"; });
</script>
</body>
</html>
